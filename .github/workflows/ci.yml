name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements.txt
      # No ANTHROPIC_API_KEY here on purpose: the suite must pass fully offline
      # on the deterministic planner.
      - run: pytest -q
      - name: demo runs end to end
        run: ./run_demo.sh
